name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Test, typecheck, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run src/bin.ts audit --strict
      - run: bun bin/compound.js --help
      - run: bun run build
      - run: node bin/compound.js --help

  eval:
    name: Eval smoke suite over the plugin's learnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Replays evals/ from its cassettes with no key. The full collections (Cora,
      # compound-packs, BabyAgent, the whole plugin set) live in the private cases
      # repository, kieranklaassen/compound-evals, whose CI pins this CLI by commit.
      - run: bun run eval:ci
